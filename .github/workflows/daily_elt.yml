name: Daily Northern Thailand ELT Pipeline

on:
  schedule:
    # Run daily at 06 00 ICT (23 00 UTC)
    - cron: "0 23 * * *"
    # Run monthly full Gold rebuild on the first day of each month at 07 00 ICT (00 00 UTC)
    - cron: "0 0 1 * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "ELT execution mode (daily or full)"
        required: true
        default: "daily"
        type: choice
        options:
          - daily
          - full

concurrency:
  group: northern-risk-elt
  cancel-in-progress: false

jobs:
  run-medallion-elt:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "backend/requirements.txt"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run deterministic pytest guardrail suite and log Layer 1 status
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          pytest -q tests/test_guardrails.py
          python -m src.evaluation.layered_eval --layer code_tests --role baseline

      - name: Execute scheduled Medallion ELT batch
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: "gemini-3.5-flash-lite"
          GEMINI_EXTRACTION_MODEL: "gemini-3.5-flash-lite"
          GEMINI_VISION_MODEL: "gemini-3.8-flash"
          GEMINI_VISION_TIMEOUT_MS: "180000"
          GEMINI_VISION_PAGE_RETRIES: "2"
          GEMINI_VISION_RETRY_BASE_SECONDS: "30"
          GEMINI_VISION_MAX_RETRY_WAIT_SECONDS: "300"
          GEMINI_VISION_TRANSIENT_COOLDOWN_SECONDS: "900"
        run: |
          MODE="daily"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MODE="${{ github.event.inputs.mode }}"
          elif [ "${{ github.event.schedule }}" = "0 0 1 * *" ]; then
            MODE="full"
          fi
          echo "Running ELT pipeline in mode ${MODE}"
          python run_pipeline.py --mode "${MODE}" --news-limit 80
