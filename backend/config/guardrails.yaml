# Guardrails configuration
llm:
  temperature: 0.0
  max_output_tokens: 1024
  min_extraction_confidence: 0.65

rag:
  top_k: 5
  min_similarity_threshold: 0.50
  # Vector weight for hybrid search
  hybrid_alpha: 0.68
  refusal_message_th: "ขอโทษครับ ตอนนี้ผมยังไม่มีเอกสารอ้างอิงที่ใช้ตอบเรื่องนี้ได้ เลยไม่อยากเดาคำตอบครับ ถ้าเป็นเรื่องเศรษฐกิจภาคเหนือ การจัดการหนี้ หรือมาตรการช่วยเหลือ ลองถามต่อได้เลยครับ หากต้องการยืนยันสิทธิ์เฉพาะราย แนะนำติดต่อเจ้าหนี้หรือ ธปท. 1213"
  refusal_message_en: "Sorry, I don’t have a supporting source for this yet, so I don’t want to guess. I can help with Northern Thailand’s economy, debt management, or support programs. For individual eligibility, please check with your lender or the Bank of Thailand at 1213."

air4thai:
  # Thailand PCD elevated and critical PM2.5 thresholds
  pm25_elevated_threshold: 37.5
  pm25_critical_threshold: 75.0
  invalid_sentinel: -1.0

rate_limits:
  relief_check: "20/minute"
  chat: "15/minute"
  refresh: "3/hour"
  staff_login: "10/minute"
