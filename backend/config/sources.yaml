# External data source endpoints and extraction parameters
air4thai:
  endpoint_url: "https://air4thai.pcd.go.th/services/getNewAQI_JSON.php"
  timeout_sec: 20

open_meteo:
  air_quality_url: "https://air-quality-api.open-meteo.com/v1/air-quality"
  weather_url: "https://archive-api.open-meteo.com/v1/archive"
  lookback_months: 36
  heavy_rain_threshold_mm: 35.0
  max_workers: 4
  timeout_sec: 30

news:
  google_rss_base: "https://news.google.com/rss/search"
  max_items_per_query: 8
  max_workers: 8
  queries:
    - "จังหวัดเชียงใหม่ (ท่องเที่ยว OR เศรษฐกิจ OR น้ำท่วม OR PM2.5 OR โรงแรม)"
    - "จังหวัดเชียงราย (ท่องเที่ยว OR เศรษฐกิจ OR น้ำท่วม OR แม่น้ำกก OR สารหนู)"
    - "จังหวัดแม่ฮ่องสอน (ท่องเที่ยว OR เศรษฐกิจ OR ฝุ่น OR น้ำท่วม OR ปาย)"
    - "จังหวัดน่าน (ท่องเที่ยว OR เศรษฐกิจ OR น้ำท่วม OR ฝุ่น OR โรงแรม)"
    - "จังหวัดลำปาง (ท่องเที่ยว OR เศรษฐกิจ OR น้ำท่วม OR ฝุ่น OR โรงแรม)"
    - "จังหวัดลำพูน (ท่องเที่ยว OR เศรษฐกิจ OR น้ำท่วม OR ฝุ่น OR ธุรกิจ)"
    - "จังหวัดพะเยา (ท่องเที่ยว OR เศรษฐกิจ OR น้ำท่วม OR ฝุ่น OR กว๊านพะเยา)"
    - "จังหวัดแพร่ (ท่องเที่ยว OR เศรษฐกิจ OR น้ำท่วม OR แม่น้ำยม OR ฝุ่น)"
    - "จังหวัดอุตรดิตถ์ (ท่องเที่ยว OR เศรษฐกิจ OR น้ำท่วม OR ฝุ่น OR ธุรกิจ)"
    - "จังหวัดตาก (ท่องเที่ยว OR เศรษฐกิจ OR น้ำท่วม OR แม่สอด OR ฝุ่น)"
    - "จังหวัดสุโขทัย (ท่องเที่ยว OR เศรษฐกิจ OR น้ำท่วม OR แม่น้ำยม OR โรงแรม)"
    - "จังหวัดพิษณุโลก (ท่องเที่ยว OR เศรษฐกิจ OR น้ำท่วม OR ฝุ่น OR โรงแรม)"
    - "จังหวัดพิจิตร (ท่องเที่ยว OR เศรษฐกิจ OR น้ำท่วม OR ฝุ่น OR ธุรกิจ)"
    - "จังหวัดเพชรบูรณ์ (ท่องเที่ยว OR เศรษฐกิจ OR เขาค้อ OR น้ำท่วม OR โรงแรม)"
    - "จังหวัดกำแพงเพชร (ท่องเที่ยว OR เศรษฐกิจ OR น้ำท่วม OR ฝุ่น OR ธุรกิจ)"
    - "จังหวัดนครสวรรค์ (ท่องเที่ยว OR เศรษฐกิจ OR น้ำท่วม OR ฝุ่น OR โรงแรม)"
    - "จังหวัดอุทัยธานี (ท่องเที่ยว OR เศรษฐกิจ OR น้ำท่วม OR ฝุ่น OR โรงแรม)"
    - "แม่น้ำกก แม่น้ำสาย สารหนู โลหะหนัก เชียงราย เชียงใหม่"
    - "เศรษฐกิจภาคเหนือ ธนาคารแห่งประเทศไทย ภาคบริการ หนี้"

